services:
  openwebdav:
    image: ghcr.io/your-org/openwebdav:latest
    ports:
      - "8080:80"
    volumes:
      - openwebdav_data:/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: PostgreSQL for production
  # postgres:
  #   image: postgres:16-alpine
