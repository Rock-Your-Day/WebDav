name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Stage 1: Lint & Static Analysis (parallel)
  # ═══════════════════════════════════════════════════════════════════════

  backend-lint:
    name: "Backend: Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: ruff check backend/
      - run: ruff format --check backend/
      - run: mypy backend/app/ --ignore-missing-imports

  frontend-lint:
    name: "Frontend: Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 2: Security Scanning (parallel)
  # ═══════════════════════════════════════════════════════════════════════

  backend-security:
    name: "Security: Python SAST & Deps"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Bandit SAST scan
        run: bandit -r backend/app/ --severity-level medium
      - name: pip-audit dependency check
        run: pip-audit -r backend/requirements.txt || true

  frontend-security:
    name: "Security: Node.js Deps"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: npm audit (fail on critical)
        run: cd frontend && npm audit --audit-level=critical

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 3: Unit & Integration Tests (parallel)
  # ═══════════════════════════════════════════════════════════════════════

  backend-test:
    name: "Test: Backend (pytest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: cd backend && pytest --cov=app --cov-report=xml -v
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          file: backend/coverage.xml

  frontend-test:
    name: "Test: Frontend (vitest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run test

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 4: Docker Build (requires all above to pass)
  # ═══════════════════════════════════════════════════════════════════════

  docker-build:
    name: "Build: Docker Image"
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - frontend-lint
      - backend-security
      - frontend-security
      - backend-test
      - frontend-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: openwebdav:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════════════════════════
  # Stage 5: E2E Tests & Container Scan (requires Docker build)
  # ═══════════════════════════════════════════════════════════════════════

  e2e-test:
    name: "Test: E2E (Playwright)"
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: openwebdav:ci
          cache-from: type=gha
      - name: Start container
        run: |
          docker run -d --name openwebdav-e2e -p 8080:80 \
            -e SECRET_KEY=ci-test-secret \
            -e DATABASE_URL="sqlite+aiosqlite:////data/db/openwebdav.db" \
            -e DEFAULT_STORAGE_PATH=/data/storage \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=admin123 \
            openwebdav:ci
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health; then
              echo " Container ready"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to start"
          docker logs openwebdav-e2e
          exit 1
      - name: Run E2E tests
        run: cd frontend && npx playwright test --reporter=github
        env:
          BASE_URL: http://localhost:8080
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  container-scan:
    name: "Security: Container Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: openwebdav:ci
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: "openwebdav:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
