name: Publish Docker Image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Gate: Run ALL checks before publishing
  # ═══════════════════════════════════════════════════════════════════════

  backend-lint:
    name: "Gate: Backend Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: ruff check backend/
      - run: ruff format --check backend/

  backend-security:
    name: "Gate: Backend Security"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: bandit -r backend/app/ --severity-level medium

  backend-test:
    name: "Gate: Backend Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: cd backend && pytest -v

  frontend-lint:
    name: "Gate: Frontend Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck

  frontend-test:
    name: "Gate: Frontend Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run test

  secret-scan:
    name: "Gate: Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # E2E: Build image, run E2E tests, scan container
  # ═══════════════════════════════════════════════════════════════════════

  e2e-test:
    name: "Gate: E2E Tests"
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-security, backend-test, frontend-lint, frontend-test, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: openwebdav:release
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name openwebdav-e2e -p 8080:80 \
            -e SECRET_KEY=ci-release-secret \
            -e DATABASE_URL="sqlite+aiosqlite:////data/db/openwebdav.db" \
            -e DEFAULT_STORAGE_PATH=/data/storage \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=admin123 \
            openwebdav:release
      - name: Wait for healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health; then
              echo " Container ready"
              exit 0
            fi
            sleep 2
          done
          docker logs openwebdav-e2e
          exit 1
      - name: Run E2E tests
        run: cd frontend && npx playwright test --reporter=github
        env:
          BASE_URL: http://localhost:8080
          CI: true

  container-scan:
    name: "Gate: Container Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-security, backend-test, frontend-lint, frontend-test, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: openwebdav:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "openwebdav:scan"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  # ═══════════════════════════════════════════════════════════════════════
  # Publish: Only after ALL gates pass
  # ═══════════════════════════════════════════════════════════════════════

  publish:
    name: "Publish: Push to GHCR"
    runs-on: ubuntu-latest
    needs: [e2e-test, container-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
